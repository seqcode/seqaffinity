[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seqaffinity"
version = "0.1.0"
description = "Whole-sequence PWM affinity scoring: max-site, TBA, TRAP and partition-function occupancy, per sequence or genome-wide"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=1.5"]

[project.optional-dependencies]
fast = ["numba>=0.58"]
scan = ["numba>=0.58", "pyfaidx>=0.8"]
bigwig = ["pyBigWig>=0.3.22"]
dev = ["pytest>=7"]

[project.scripts]
seqaffinity = "seqaffinity.cli:main"

[tool.setuptools]
packages = ["seqaffinity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: performance tests (run with -m slow)"]
